apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohsim-frontend
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ohsim-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ohsim-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    1001
      containers:
        - name: frontend
          image: ghcr.io/your-org/ohsim-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          env:
            - name:  NEXT_PUBLIC_API_URL
              value: "https://api.your-domain.com"
            - name:  NODE_ENV
              value: "production"
          resources:
            requests:
              cpu:    "100m"
              memory: "256Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 20
            periodSeconds:       15
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds:       10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: ohsim-frontend
  ports:
    - name:       http
      port:       3001
      targetPort: 3001
  type: ClusterIP
