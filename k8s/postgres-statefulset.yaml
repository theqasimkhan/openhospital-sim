apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: ohsim-postgres
  template:
    metadata:
      labels:
        app: ohsim-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ohsim-config
                  key:  POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ohsim-secrets
                  key:  POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ohsim-secrets
                  key:  POSTGRES_PASSWORD
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "2Gi"
          volumeMounts:
            - name:      postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "openhospital"]
            initialDelaySeconds: 30
            periodSeconds:       10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: ohsim
spec:
  selector:
    app: ohsim-postgres
  ports:
    - port:       5432
      targetPort: 5432
  clusterIP: None  # headless – StatefulSet requires headless service
