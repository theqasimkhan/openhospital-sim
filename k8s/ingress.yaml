# Requires nginx-ingress-controller or equivalent in your cluster.
# Update host values and TLS secret for your domain.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ohsim-ingress
  namespace: ohsim
  labels:
    app.kubernetes.io/name: openhospital-sim
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size:       "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    cert-manager.io/cluster-issuer:                    "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - your-domain.com
        - api.your-domain.com
      secretName: ohsim-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3001
    - host: api.your-domain.com
      http:
        paths:
          - path:     /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 8000
