apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ohsim-redis
  template:
    metadata:
      labels:
        app: ohsim-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--maxmemory"
            - "256mb"
            - "--maxmemory-policy"
            - "allkeys-lru"
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu:    "100m"
              memory: "128Mi"
            limits:
              cpu:    "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds:       10

---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: ohsim
spec:
  selector:
    app: ohsim-redis
  ports:
    - port:       6379
      targetPort: 6379
  type: ClusterIP
