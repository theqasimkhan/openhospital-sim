apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohsim-backend
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ohsim-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge:       1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ohsim-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path:   "/api/v1/metrics"
        prometheus.io/port:   "8000"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser:    1000
      containers:
        - name: backend
          image: ghcr.io/your-org/ohsim-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: ohsim-config
            - secretRef:
                name: ohsim-secrets
          resources:
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/ping
              port: 8000
            initialDelaySeconds: 15
            periodSeconds:       10
            failureThreshold:    3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds:       5
            failureThreshold:    3
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ohsim
  labels:
    app.kubernetes.io/name:      openhospital-sim
    app.kubernetes.io/component: backend
spec:
  selector:
    app: ohsim-backend
  ports:
    - name:       http
      port:       8000
      targetPort: 8000
  type: ClusterIP
