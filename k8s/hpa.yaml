# Horizontal Pod Autoscaler – requires metrics-server in the cluster.
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ohsim-backend-hpa
  namespace: ohsim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       ohsim-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type:               Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ohsim-frontend-hpa
  namespace: ohsim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind:       Deployment
    name:       ohsim-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type:               Utilization
          averageUtilization: 70
