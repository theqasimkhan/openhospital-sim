# ⚠️  Replace all <base64-encoded-value> placeholders before applying.
# Generate with:  echo -n "your-value" | base64
#
# Do NOT commit real secrets to version control.
# Use a secrets manager (Vault, AWS Secrets Manager, Sealed Secrets) in production.
apiVersion: v1
kind: Secret
metadata:
  name: ohsim-secrets
  namespace: ohsim
  labels:
    app.kubernetes.io/name: openhospital-sim
type: Opaque
data:
  POSTGRES_USER:     <base64-encoded-value>
  POSTGRES_PASSWORD: <base64-encoded-value>
  REDIS_PASSWORD:    <base64-encoded-value>
  SECRET_KEY:        <base64-encoded-value>
