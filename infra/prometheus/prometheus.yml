global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    project: openhospital-sim

scrape_configs:
  - job_name: "ohsim-backend"
    metrics_path: "/api/v1/metrics"
    static_configs:
      - targets: ["backend:8000"]
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
